<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sharda SelfStudy — App Portal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen" class="splash-container">
        <div class="splash-content">
            <div class="splash-logo">
                <span class="logo-icon">S²</span>
            </div>
            <h1 class="splash-title">Sharda SelfStudy</h1>
            <p class="splash-tagline">Learn. Track. Grow.</p>
            <div class="splash-loader">
                <div class="spinner"></div>
            </div>
            <button id="enter-portal-btn" class="btn btn-primary btn-lg" style="margin-top: 2rem; display: none;">Launch App</button>
        </div>
    </div>

    <!-- 2. AUTHENTICATION CONTAINER -->
    <div id="auth-view" class="view-container hidden">
        <div class="auth-card">
            <div class="auth-header">
                <span class="logo-sm">S²</span>
                <h2>Sharda SelfStudy</h2>
                <p>Sign in to your academic portal</p>
            </div>

            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Login</button>
                <button class="tab-btn" data-tab="register">Register</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" required placeholder="student@sharda.edu">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <div class="form-actions-row">
                    <a href="#" id="forgot-password-link">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form hidden">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-fullname" required placeholder="Aarav Sharma">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" required placeholder="student@sharda.edu">
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="reg-dob" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" required placeholder="••••••••">
                </div>
                <p class="form-notice">Accounts require admin approval before access.</p>
                <button type="submit" class="btn btn-primary w-100">Register Student</button>
            </form>

            <div id="auth-error" class="alert alert-error hidden"></div>
            <div id="auth-success" class="alert alert-success hidden"></div>
        </div>
    </div>

    <!-- 3. APP SHELL CONTAINER -->
    <div id="app-view" class="app-layout hidden">
        
        <!-- App Top Header Bar -->
        <header class="app-topbar">
            <div class="app-header-left">
                <div id="topbar-avatar" class="avatar-placeholder sm">SS</div>
                <div>
                    <h3 id="app-screen-title">Dashboard</h3>
                    <small id="app-user-greeting">Welcome back</small>
                </div>
            </div>
            <button id="logout-btn-top" class="icon-btn" title="Logout">🚪</button>
        </header>

        <!-- Dynamic Content Body -->
        <main class="app-content-body" id="dashboard-content">
            <!-- Views render here -->
        </main>

        <!-- App Bottom Navigation Bar -->
        <nav class="app-bottom-nav" id="bottom-nav-links">
            <!-- Dynamically populated based on role -->
        </nav>
    </div>

    <!-- MODAL & TOAST CONTAINERS -->
    <div id="modal-container" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Details</h3>
                <button id="modal-close-btn" class="modal-close">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
